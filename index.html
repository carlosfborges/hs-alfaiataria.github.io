<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Manipulação de Div</title>
    <link rel="stylesheet" href="menu-suspenso.css">
    <link rel="stylesheet" href="main.css">

<body>
<main>
    <nav class="menu">
        <ul>
            <li class="dropdown">
                <a href="#">Camisa Social</a>
                <ul class="submenu">
                    <li selected="true"><img data-model="mod1h" data-text="Camisa social masculina" src="modelos/social-homem-frente.jpeg" alt="Camisa Social 1" width="50"></li>
                    <li><img data-model="mod1m" data-text="Camisa social feminina" src="modelos/social-mulher-frente.jpeg" alt="Camisa Social 2" width="50"></li>
                    </ul>
            </li>
            <li class="dropdown">
                <a href="#">Social Manga Curta</a>
                <ul class="submenu">
                    <li><img data-model="mod2h" data-text="Camisa social manga curta masculina" src="modelos/social_manga_curta-homem-frente.jpeg" alt="Social Manga Curta 1" width="50"></li>
                    <li><img data-model="mod2m" data-text="Camisa social manga curta feminina" src="modelos/social_manga_curta-mulher-frente.jpeg" alt="Social Manga Curta 2" width="50"></li>
                </ul>
            </li>
            <li class="dropdown">
                <a href="#">Polo</a>
                <ul class="submenu">
                    <li><img data-model="mod3h" data-text="Camisa polo masculina" src="modelos/polo-homem-frente.jpeg" alt="Polo 1" width="50"></li>
                    <li><img data-model="mod3m" data-text="Camisa polo feminina" src="modelos/polo-mulher-frente.jpeg" alt="Polo 2" width="50"></li>
                </ul>
            </li>
        </ul>
    </nav>

    <div id="workspace">
        <div class="aux">
            <div>
                <button id="addDiv">
                    <i class="material-icons" style="font-size:36px">perm_media</i>
                    Ad. Arte
                </button>
                <form>
                    <div>
                        <input id="img-input" type="file" name="imagem">
                    </div>
                </form>
            </div>
        </div>

        <div class="container">
            <div id="container-model" class="container-imgs">
                <img src="modelos/social-homem-frente.jpeg" alt="Camisa Social 1">
                <img class="mask mask-base" src="modelos/social-homem-frente-mask-base.png" alt="Mascara base" style="filter: url(#color-00)">
                <img class="mask mask-forro" src="modelos/social-homem-frente-mask-forro.png" alt="Mascara forros" style="filter: url(#color-00)">
                <img class="mask mask-gola" src="modelos/social-homem-frente-mask-gola.png" alt="Mascara gola" style="filter: url(#color-00)">
                <img class="mask mask-botoes" src="modelos/social-homem-frente-mask-botoes.png" alt="Mascara botoes" style="filter: url(#color-00)">
            </div>
        </div>

        <div class="controls">
            <div selected="true" data-finishname="Base" data-finishvalue="base" data-colorname="Branco" data-colorvalue="rgb(250, 250, 250)">
                <i class="material-icons" style="font-size:36px">color_lens</i>
                Base
            </div>
            <div data-finishname="Gola" data-finishvalue="gola" data-colorname="Laranja" data-colorvalue="rgb(255, 63, 0)">
                <i class="material-icons" style="font-size:36px">color_lens</i>
                Gola
            </div>
            <div data-finishname="Forro" data-finishvalue="forro" data-colorname="Branco" data-colorvalue="rgb(250, 250, 250)">
                <i class="material-icons" style="font-size:36px">color_lens</i>
                Forro
            </div>
            <div data-finishname="Botões" data-finishvalue="botoes" data-colorname="Branco" data-colorvalue="rgb(250, 250, 250)">
                <i class="material-icons" style="font-size:36px">color_lens</i>
                Botões
            </div>
        </div>

        <div class="options">
            <p>Opções de cores: <span id="finish-name">Base</span></p>
            <p>Cor selecionada: <span id="color-name">Branco</span></p>
            <div class="colors">

                <div title="cor-19" style="background-color: rgb(0, 191, 255);"></div>

                <div title="cor-21" style="background-color: rgb(0, 63, 255);"></div>
                <div title="cor-36" style="background-color: rgb(0, 0, 128);"></div> 
                <div title="cor-32" style="background-color: rgb(75, 0, 130);"></div> 
                <div title="cor-24" style="background-color: rgb(127, 0, 255);"></div>
                <div title="cor-25" style="background-color: rgb(191, 0, 255);"></div>
                <div title="cor-26" style="background-color: rgb(255, 0, 255);"></div> 
                <div title="cor-27" style="background-color: rgb(255, 0, 191);"></div>

                <div title="cor-29" style="background-color: rgb(255, 0, 63);"></div>
                <div title="cor-33" style="background-color: rgb(238, 130, 238);"></div> 
                <div title="cor-31" style="background-color: rgb(255, 192, 203);"></div> 
                <div title="cor-34" style="background-color: rgb(128, 0, 0);"></div> 
                <div title="cor-37" style="background-color: rgb(128, 128, 0);"></div>
            </div>
        </div>
        
        <div class="space"></div>

        <div class="shirt-title">
            <h2>Camisa social masculina</h2>
        </div>

        <div class="space"></div>

        <div class="share">
          <p class="flex-column-center"><i class="material-icons">picture_as_pdf</i> Salvar PDF</p>
        </div>
    </div>

    <script src="lib.js"></script>
    <script src="menu-suspenso.js"></script>
    <script src="main.js"></script>
    <script src="colors.js"></script>
